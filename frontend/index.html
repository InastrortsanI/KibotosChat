<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>키보토스 채팅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 로그인 화면 -->
  <section id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card">
      <h1 class="brand">키보토스 채팅</h1>
      <p class="muted">샬레의 선생님으로 학생들과 이야기를 나눠 보세요.</p>
      <label>아이디<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+"></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
      <label class="signup-only">학생들이 부를 이름 (선택)<input name="sensei_name" maxlength="20" placeholder="비워 두면 '선생님'"></label>
      <p id="auth-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit" id="auth-submit">로그인</button>
      <button class="btn link" type="button" id="auth-toggle">처음이신가요? 계정 만들기</button>
    </form>
  </section>

  <!-- 메인 화면 -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <span class="brand small">키보토스 채팅</span>
        <button class="icon-btn only-mobile" id="close-sidebar" aria-label="메뉴 닫기">✕</button>
      </div>
      <nav class="tabs" aria-label="메뉴">
        <button data-view="roster" class="tab active">학생 명부</button>
        <button data-view="stories" class="tab">스토리</button>
        <button data-view="world" class="tab">세계관</button>
      </nav>
      <h2 class="side-title">내 대화</h2>
      <ul id="room-list" class="room-list"></ul>
      <div class="sidebar-foot">
        <span id="me-name" class="muted"></span>
        <button class="btn link" id="logout">로그아웃</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar only-mobile">
        <button class="icon-btn" id="open-sidebar" aria-label="메뉴 열기">☰</button>
        <span class="brand small" id="topbar-title">키보토스 채팅</span>
      </header>

      <!-- 학생 명부 -->
      <section id="view-roster" class="view">
        <div class="view-head">
          <h1>학생 명부</h1>
          <input id="search" type="search" placeholder="이름, 학교, 동아리로 찾기" aria-label="학생 검색">
        </div>
        <div id="school-filter" class="chips" role="group" aria-label="학교 필터"></div>
        <ul id="roster" class="roster"></ul>
      </section>

      <!-- 스토리 -->
      <section id="view-stories" class="view" hidden>
        <div class="view-head"><h1>스토리</h1></div>
        <p class="muted">여러 학생이 함께 등장하는 이야기입니다. 시나리오를 고르고 함께할 학생을 정하세요.</p>
        <ul id="scenario-list" class="scenarios"></ul>
      </section>

      <!-- 세계관 -->
      <section id="view-world" class="view" hidden>
        <div class="view-head"><h1>세계관</h1></div>
        <div id="world" class="world"></div>
      </section>

      <!-- 채팅 -->
      <section id="view-chat" class="view chat" hidden>
        <header class="chat-head">
          <div id="chat-halos" class="chat-halos"></div>
          <div class="chat-title">
            <h1 id="chat-title"></h1>
            <p id="chat-sub" class="muted"></p>
          </div>
          <select id="provider" aria-label="AI 모델"></select>
          <button class="icon-btn" id="delete-room" aria-label="대화 삭제" title="대화 삭제">🗑</button>
        </header>
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <form id="composer" class="composer">
          <div class="composer-tools">
            <button type="button" class="btn ghost" id="btn-continue">이어서 진행</button>
            <button type="button" class="btn ghost" id="btn-regen">다시 생성</button>
            <button type="button" class="btn ghost" id="btn-undo">되돌리기</button>
          </div>
          <div class="composer-row">
            <textarea id="input" rows="2" maxlength="2000" placeholder="대사를 쓰거나 *행동*을 별표로 감싸 쓰세요"></textarea>
            <button class="btn primary" type="submit" id="send">보내기</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- 학생 상세 / 스토리 설정 시트 -->
  <dialog id="sheet" class="sheet">
    <form method="dialog" class="sheet-inner" id="sheet-body"></form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
