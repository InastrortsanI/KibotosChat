<title>키보토스 채팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽 메뉴(모바일은 서랍) + 오른쪽 화면. 하늘색 바탕에 학교 색 헤일로 */
:root {
  --bg: #eef5fb; --paper: #ffffff; --ink: #1b2a4a; --ink-soft: #5b6b86; --line: #d7e3ef;
  --blue: #1a7fd4; --blue-deep: #1466b0; --on-blue: #ffffff; --halo: #f2c230; --halo-track: #e3ebf3;
  --hover: #f5f9fe; --scrim: rgba(27, 42, 74, .45); --danger: #c93a52; --gold-text: #8a6a00;
  --radius-sm: 6px; --radius-lg: 14px;
  --display: "Do Hyeon", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1828; --paper: #16233a; --ink: #e4ecf8; --ink-soft: #9badc9; --line: #283a58;
  --blue: #2378cc; --blue-deep: #8ccaff; --on-blue: #ffffff; --halo: #f2c230; --halo-track: #2a3b57;
  --hover: #1c2c47; --scrim: rgba(0, 0, 0, .55); --danger: #ff7a8f; --gold-text: #f2c230; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1828; --paper: #16233a; --ink: #e4ecf8; --ink-soft: #9badc9; --line: #283a58;
  --blue: #2378cc; --blue-deep: #8ccaff; --on-blue: #ffffff; --halo: #f2c230; --halo-track: #2a3b57;
  --hover: #1c2c47; --scrim: rgba(0, 0, 0, .55); --danger: #ff7a8f; --gold-text: #f2c230; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 var(--body); -webkit-text-size-adjust: 100%; overflow: hidden; }
h1, h2, .brand { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; line-height: 1.2; }
.muted { color: var(--ink-soft); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.btn { font: 500 .95rem var(--body); border: 0; cursor: pointer; padding: .55rem 1.1rem; border-radius: var(--radius-sm); color: var(--ink); background: transparent; }
.btn.primary { background: var(--blue); color: var(--on-blue); transform: skewX(-10deg); white-space: nowrap; }
.btn.primary:hover { background: var(--blue-deep); }
.btn.ghost { border: 1px solid var(--line); background: var(--paper); }
.btn.ghost:hover { border-color: var(--blue); }
.btn.link { color: var(--blue-deep); padding: .3rem .2rem; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { border: 0; background: none; font-size: 1.2rem; cursor: pointer; color: var(--ink-soft); padding: .3rem .5rem; }

input, textarea, select { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .55rem .7rem; width: 100%; }
input:focus, textarea:focus, select:focus { border-color: var(--blue); outline: none; }

.app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }
.sidebar { background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 1rem; gap: .8rem; }
.sidebar-head { display: flex; justify-content: space-between; align-items: center; }
.brand.small { font-size: 1.35rem; color: var(--blue-deep); }
.tabs { display: grid; gap: .2rem; }
.tab { text-align: left; border: 0; background: none; font: 500 1rem var(--body); padding: .5rem .7rem; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink); }
.tab.active { background: var(--bg); color: var(--blue-deep); box-shadow: inset 3px 0 var(--blue); }
.side-title { font-size: 1rem; color: var(--ink-soft); margin-top: .4rem; }
.room-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: grid; align-content: start; gap: 2px; }
.room-list button { width: 100%; text-align: left; border: 0; background: none; padding: .5rem .6rem; border-radius: var(--radius-sm); cursor: pointer; font: inherit; color: inherit; display: grid; }
.room-list button:hover, .room-list button.active { background: var(--bg); }
.room-meta { font-size: .82rem; color: var(--ink-soft); }
.sidebar-foot { display: grid; gap: .2rem; border-top: 1px solid var(--line); padding-top: .6rem; font-size: .85rem; }
.sidebar-foot .row { display: flex; justify-content: space-between; align-items: center; }
.save-note { font-size: .8rem; color: var(--ink-soft); }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow-y: auto; padding-block: 2rem; padding-inline: clamp(16px, 4vw, 48px); }
.view-head { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1rem; }
.view-head input { max-width: 320px; }
.topbar { display: none; align-items: center; gap: .5rem; padding: .6rem 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar .brand { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.only-mobile { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.2rem; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: .35rem .9rem; font: inherit; font-size: .9rem; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.roster { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: .5rem; }
.roster button { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: .8rem; align-items: center; text-align: left; font: inherit; color: inherit; background: var(--paper); border: 0; border-left: 4px solid var(--school, var(--line)); border-radius: var(--radius-sm); padding: .6rem .8rem; cursor: pointer; }
.roster button:hover { background: var(--hover); }
.who { min-width: 0; }
.who strong { display: block; font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.who span { font-size: .85rem; color: var(--ink-soft); }
.tag-basic { font-family: var(--body); font-size: .7rem; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 4px; padding: 0 .3rem; margin-left: .3rem; vertical-align: middle; }

/* 헤일로 아바타: 노란 링이 호감도만큼 찬다 */
.halo { --size: 44px; --pct: 0; position: relative; width: var(--size); height: var(--size); flex: none; display: inline-block; }
.halo .face { position: absolute; inset: 4px; border-radius: 50%; background: color-mix(in srgb, var(--school, var(--blue)) 78%, #000); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--size) * .42); }
.halo .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--halo) calc(var(--pct) * 1%), var(--halo-track) 0); -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%); mask: radial-gradient(circle, transparent 62%, #000 63%); }
.halo.big { --size: 58px; }
.halo.huge { --size: 96px; }
.halo img.face { width: calc(100% - 8px); height: calc(100% - 8px); object-fit: cover; }
.halo.bump .ring { animation: glow .9s ease-out; }
@keyframes glow { 40% { filter: drop-shadow(0 0 7px var(--halo)); } }
/* 감정 말풍선: 아이콘 오른쪽 위에 작게 뜬다 */
.face-wrap { position: relative; display: inline-block; }
.emote { position: absolute; top: -10px; right: -12px; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 12px; background: var(--paper); border: 1.5px solid var(--line);
  display: grid; place-items: center; font: 700 .8rem/1 var(--body); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); animation: emote-pop .35s ease-out; white-space: nowrap; }
@keyframes emote-pop { 0% { transform: scale(0) translateY(6px); } 70% { transform: scale(1.2); } 100% { transform: none; } }

.scenarios { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .8rem; max-width: 760px; }
.scenarios button { width: 100%; text-align: left; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1rem 1.2rem; cursor: pointer; display: grid; gap: .3rem; }
.scenarios button:hover { border-color: var(--blue); }
.scenarios h2 { font-size: 1.35rem; }
.loc { font-size: .88rem; color: var(--blue-deep); }

.world { max-width: 68ch; display: grid; gap: 1.6rem; }
.world h2 { font-size: 1.4rem; margin-bottom: .3rem; }
.world p { margin: 0; }

.view.chat { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: .8rem; padding-block: .8rem; padding-inline: clamp(16px, 3vw, 32px); background: var(--paper); border-bottom: 1px solid var(--line); }
.chat-halos { display: flex; }
.chat-halos .halo + .halo { margin-left: -12px; }
.chat-title { flex: 1; min-width: 0; }
.chat-title h1 { font-size: 1.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-title p { margin: 0; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head select { width: auto; max-width: 150px; font-size: .85rem; }

.messages-wrap { flex: 1; min-height: 0; position: relative; display: flex; }
.jump { position: absolute; right: clamp(16px, 4vw, 48px); bottom: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--blue-deep); border-radius: 999px; padding: .35rem .9rem; font: 500 .85rem var(--body); cursor: pointer; }
.scene-line { font-size: .85rem; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: .4rem; margin-top: .2rem; }
.messages { list-style: none; margin: 0; flex: 1; overflow-y: auto; padding-block: 1.5rem; padding-inline: clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 1.2rem; }
.msg { max-width: 68ch; min-width: 0; word-break: keep-all; } /* 한글이 글자 중간에서 줄바꿈되지 않게 */
.msg.user { align-self: flex-end; background: var(--blue); color: #ffffff; -webkit-text-fill-color: #ffffff; padding: .65rem 1rem; border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg); white-space: pre-wrap; max-width: min(68ch, 85%); overflow-wrap: anywhere; }
.msg.assistant { align-self: flex-start; display: grid; gap: .7rem; width: 100%; }
.narr { color: var(--ink-soft); margin: 0; padding-left: .75rem; border-left: 3px solid var(--line); }
.line { display: grid; grid-template-columns: auto 1fr; gap: .6rem; align-items: start; }
.line .halo { --size: 34px; }
.bubble { background: var(--paper); border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg); padding: .6rem 1rem; border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.bubble b { display: block; font-family: var(--display); font-weight: 400; font-size: 1rem; color: color-mix(in srgb, var(--school, var(--blue-deep)) 55%, var(--ink)); margin-bottom: .1rem; }
.plain { margin: 0; overflow-wrap: anywhere; }
.affection-note { font-size: .85rem; color: var(--gold-text); }
.status-line { color: var(--ink-soft); }
.error-line { color: var(--danger); font-size: .88rem; }
.empty { color: var(--ink-soft); }

.composer { background: var(--paper); border-top: 1px solid var(--line); padding-block: .7rem 1rem; padding-inline: clamp(16px, 3vw, 32px); display: grid; gap: .5rem; }
.composer-tools { display: flex; gap: .4rem; flex-wrap: wrap; }
.composer-tools .btn { font-size: .85rem; padding: .3rem .7rem; }
.format-tools { display: flex; gap: .4rem; margin-left: auto; }
.format-tools .btn { min-width: 2.6rem; font-weight: 700; }
.msg[data-i] { cursor: pointer; }
.msg.selected.user { box-shadow: 0 0 0 2px var(--blue-deep); }
.msg.selected.assistant { box-shadow: -3px 0 0 var(--blue); padding-left: .5rem; }
.msg-bar { display: flex; align-items: center; gap: .4rem; background: var(--bg); border-radius: var(--radius-sm); padding: .35rem .5rem; }
.msg-bar span { flex: 1; min-width: 0; font-size: .85rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-bar .btn { font-size: .85rem; padding: .3rem .8rem; }
.btn.danger { border: 1px solid var(--danger); background: var(--paper); color: var(--danger); }
.composer-row { display: flex; gap: .6rem; align-items: end; }
.composer-row textarea { resize: none; }

.sheet { border: 0; padding: 0; border-radius: var(--radius-lg); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); color: var(--ink); background: var(--paper); }
.sheet::backdrop { background: var(--scrim); }
.sheet-inner { padding: 1.5rem; display: grid; gap: 1rem; }
.sheet-top { display: flex; gap: 1rem; align-items: center; }
.sheet-top h2 { font-size: 1.8rem; word-break: keep-all; }
.sheet-top p { margin: 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin: 0; font-size: .95rem; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; }
.sheet label { display: grid; gap: .35rem; font-size: .95rem; }
.sheet-actions { display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; }
.pick { display: flex; flex-wrap: wrap; gap: .35rem; max-height: 200px; overflow-y: auto; padding: .2rem; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .6rem 1rem; border-radius: var(--radius-sm); font-size: .9rem; max-width: calc(100% - 32px); z-index: 30; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .only-mobile { display: initial; }
  .topbar { display: flex; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 85vw); z-index: 20; transform: translateX(-100%); transition: transform .2s;
    padding-top: calc(1rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); padding-left: calc(1rem + env(safe-area-inset-left, 0px)); }
  .sidebar.open { transform: none; box-shadow: 0 0 0 100vmax var(--scrim); }
  .view { padding-block: 1.2rem; }
  h1 { font-size: 1.6rem; }
  .chat-head { gap: .5rem; }
  .chat-head .halo.big { --size: 40px; }
  .chat-halos .halo:nth-child(n+3) { display: none; }
  .chat-title h1 { display: none; }
  .chat-head select { max-width: 92px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="app" class="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <span class="brand small">키보토스 채팅</span>
      <button class="icon-btn only-mobile" id="close-sidebar" aria-label="메뉴 닫기">✕</button>
    </div>
    <nav class="tabs" aria-label="메뉴">
      <button data-view="free" class="tab">자유 모드</button>
      <button data-view="roster" class="tab active">학생 명부</button>
      <button data-view="stories" class="tab">스토리</button>
      <button data-view="world" class="tab">세계관</button>
    </nav>
    <h2 class="side-title">내 대화</h2>
    <ul id="room-list" class="room-list"><li class="empty">대화 목록을 불러오는 중…</li></ul>
    <div class="sidebar-foot">
      <div class="row"><span id="me-name" class="muted">선생님</span><button class="btn link" id="open-settings">이름 바꾸기</button></div>
      <div class="row web-only" hidden><span id="ai-status" class="muted">AI 미설정</span><button class="btn link" id="open-ai">AI 설정</button></div>
      <span id="save-note" class="save-note"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="open-sidebar" aria-label="메뉴 열기">☰</button>
      <span class="brand small" id="topbar-title">키보토스 채팅</span>
    </header>

    <section id="view-roster" class="view">
      <div class="view-head">
        <h1>학생 명부</h1>
        <input id="search" type="search" placeholder="이름, 학교, 동아리로 찾기" aria-label="학생 검색">
      </div>
      <div id="school-filter" class="chips" role="group" aria-label="학교 필터"></div>
      <ul id="roster" class="roster"></ul>
    </section>

    <section id="view-free" class="view" hidden>
      <div class="view-head"><h1>자유 모드</h1></div>
      <p class="muted">키보토스를 돌아다니며 그곳에 있는 학생들을 만납니다. 만난 학생은 누구든 호감도가 쌓입니다. 시작할 곳을 고르세요.</p>
      <ul id="place-list" class="scenarios"></ul>
    </section>

    <section id="view-stories" class="view" hidden>
      <div class="view-head"><h1>스토리</h1></div>
      <p class="muted">여러 학생이 함께 등장하는 이야기입니다. 시나리오를 고르고 함께할 학생을 정하세요.</p>
      <ul id="scenario-list" class="scenarios"></ul>
    </section>

    <section id="view-world" class="view" hidden>
      <div class="view-head"><h1>세계관</h1></div>
      <div id="world" class="world"></div>
    </section>

    <section id="view-chat" class="view chat" hidden>
      <header class="chat-head">
        <div id="chat-halos" class="chat-halos"></div>
        <div class="chat-title"><h1 id="chat-title"></h1><p id="chat-sub" class="muted"></p></div>
        <select id="tier" aria-label="응답 방식">
          <option value="default">기본</option>
          <option value="quick">빠르게</option>
          <option value="complex">깊이 있게</option>
        </select>
        <button class="icon-btn" id="delete-room" aria-label="대화 삭제" title="대화 삭제">🗑</button>
      </header>
      <div class="messages-wrap">
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <button type="button" class="jump" id="jump" hidden>↓ 아래로</button>
      </div>
      <form id="composer" class="composer">
        <div id="msg-bar" class="msg-bar" hidden>
          <span id="msg-bar-label">메시지를 선택했습니다</span>
          <button type="button" class="btn ghost" id="msg-cancel">취소</button>
          <button type="button" class="btn danger" id="msg-del">삭제</button>
        </div>
        <div class="composer-tools">
          <button type="button" class="btn ghost" id="btn-continue">이어서</button>
          <button type="button" class="btn ghost" id="btn-regen">다시 생성</button>
          <button type="button" class="btn ghost" id="btn-undo">되돌리기</button>
          <div class="format-tools" role="group" aria-label="입력 도우미">
            <button type="button" class="btn ghost" data-wrap='"' aria-label="대사 따옴표 넣기" title="대사: 따옴표로 감싸기">" "</button>
            <button type="button" class="btn ghost" data-wrap="*" aria-label="행동 별표 넣기" title="행동: 별표로 감싸기">* *</button>
          </div>
        </div>
        <div class="composer-row">
          <textarea id="input" rows="2" maxlength="2000" placeholder="대사를 쓰거나 *행동*을 별표로 감싸 쓰세요"></textarea>
          <button class="btn primary" type="submit" id="send">보내기</button>
        </div>
      </form>
    </section>
  </main>
</div>

<dialog id="sheet" class="sheet"><form method="dialog" class="sheet-inner" id="sheet-body"></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
// 세계관·학교·학생·시나리오 데이터. tools/build_artifact.py 가 data/*.json 을 이 자리에 넣는다.
const DATA = /*__DATA__*/null;

// 실행 위치: claude.ai 안이면 window.claude 가 있다. 그 밖(GitHub Pages 등)에서는 방문자의 API 키로 AI를 직접 부른다.
const IN_CLAUDE = !!window.claude;

const $ = (s) => document.querySelector(s);
const state = {
  students: Object.fromEntries(DATA.students.map((s) => [s.id, s])),
  scenarios: DATA.scenarios, schools: DATA.schools, world: DATA.world,
  profile: { sensei_name: "" }, bonds: {}, rooms: [], room: null,
  schoolFilter: "", busy: false, ctl: null, sample: null,
};

// ───────── 저장소: claude.ai 개인 공간(db) → 안 되면 이 기기(localStorage) → 안 되면 메모리 ─────────
const store = {
  mode: "memory", db: null, uid: null, mem: {}, queue: {},
  async init() {
    try {
      const [db, user] = await Promise.all([window.claude?.use("db"), window.claude?.use("user")]);
      const uid = user ? await user.id() : null;
      if (db && uid) { this.db = db; this.uid = uid; this.mode = "db"; return; }
    } catch { /* 아래로 */ }
    this.useLocal();
  },
  useLocal() {
    try { localStorage.setItem("kc:test", "1"); localStorage.removeItem("kc:test"); this.mode = "local"; }
    catch { this.mode = "memory"; }
  },
  ref(key) { return this.db.doc(`data/users/${this.uid}/${key}`); },
  async get(key) {
    if (this.mode === "db") {
      const snap = await this.ref(key).get();
      return snap.exists ? structuredClone(snap.data()) : null;
    }
    if (this.mode === "local") { try { return JSON.parse(localStorage.getItem("kc:" + key)); } catch { return null; } }
    return this.mem[key] ? structuredClone(this.mem[key]) : null;
  },
  // 같은 문서에는 한 번에 하나씩만 쓴다 (앞의 쓰기가 끝난 뒤 다음 쓰기)
  set(key, value) { return this.chain(key, () => this.write(key, value)); },
  del(key) { return this.chain(key, () => this.write(key, null)); },
  chain(key, job) {
    const run = (this.queue[key] || Promise.resolve()).then(job, job);
    this.queue[key] = run.catch(() => {});
    return run;
  },
  async write(key, value) {
    if (this.mode === "db") {
      try { return value === null ? await this.ref(key).delete() : await this.ref(key).set(value); }
      catch (e) {
        if (e?.code === "invalid_argument" || e?.code === "revoked" || e?.code === "not_granted") {
          this.useLocal(); renderSaveNote(); toast("이 링크에서는 대화가 이 기기에만 저장됩니다.");
        } else if (e?.code === "quota_exceeded") { toast("저장 공간이 가득 찼습니다. 오래된 대화를 삭제해 주세요."); return; }
        else throw e;
      }
    }
    if (this.mode === "local") {
      try { value === null ? localStorage.removeItem("kc:" + key) : localStorage.setItem("kc:" + key, JSON.stringify(value)); return; }
      catch { this.mode = "memory"; renderSaveNote(); }
    }
    if (value === null) delete this.mem[key]; else this.mem[key] = structuredClone(value);
  },
};

function findStudentByName(name) {
  const n = name.trim();

  if (hit) return hit;
  const k = n.toLowerCase().replace(/[^a-z_ ]/g, "").trim();

}

// ① '이름: "대사"' 줄의 이름이 영어·id면 한국어 이름으로 ② 대사 속 '선상님'·'센세' 같은 호칭 변형을 그 학생의 공식 호칭으로
const WRONG_CALL = /선상님|선상|센세|센쎄|선생님아/g;
// 대사 줄의 감정 → 게임식 감정 말풍선 기호. AI는 '이름 [감정]: "대사"' 형식으로 쓴다.
const EMOTES = { 기쁨: "♪", 신남: "✨", 놀람: "!", 의문: "?", 당황: "💦", 부끄러움: "///", 화남: "💢", 슬픔: "💧", 침묵: "…", 졸림: "💤", 결의: "🔥" };
// '히나 [당황]' → { who: '히나', emo: '당황' }  (괄호 종류가 달라도 받아 준다)
function splitSpeaker(raw) {
  const m = raw.trim().match(/^(.*?)\s*[\[(（【]\s*([가-힣]{1,5})\s*[\])）】]$/);
  return m ? { who: m[1].trim(), emo: m[2] } : { who: raw.trim(), emo: "" };
}
function koreanizeNames(text) {
  return text.split("\n").map((line) => {
    const m = line.match(/^\s*([^:："*]{1,40}?)\s*([:：]\s*["“])(.*)$/);
    if (!m) return line.replace(WRONG_CALL, "선생님");
    const { who, emo } = splitSpeaker(m[1]);
    const st = findStudentByName(who);
    if (!st) return line.replace(WRONG_CALL, "선생님");
    const call = (st.call || "선생님").split(" (")[0]; // '스승님 (또는 선생님)' → '스승님'
    let said = m[3].replace(WRONG_CALL, call);
    if (call === "선생") said = said.replace(/선생님/g, "선생"); // 호시노·카요코 등은 공식 대사에서 항상 '선생'
    return st.name + (emo ? ` [${emo}]` : "") + m[2] + said;
  }).join("\n");
}

    +4~+5 고민 해결, 진심 어린 격려, 위기에서 지켜 줌   0 별다른 교류 없음
    -1~-2 무관심·짓궂은 놀림   -3~-5 무례함, 약속을 어김, 상처 주는 말
    학생의 성격에 맞춰 판단하세요. 겉으로 툴툴대는 학생도 속으로 기뻤다면 호감도는 오릅니다.
  예) [장면 장소: 샬레 집무실 | 시간: 늦은 오후 | 등장: yuuka, noa]
      [호감도 yuuka:+3]`;

// '존댓말'/'반말'만 적으면 AI가 흘려듣기 쉬워서, 어미까지 구체적으로 풀어 쓴다.
function honorificRule(h = "존댓말") {
  if (h.startsWith("존댓말")) return "존댓말 — 선생님에게 하는 모든 대사를 '~요', '~습니다' 같은 존댓말로 끝맺는다. 반말을 절대 섞지 않는다. (반드시 지킬 것)";
  if (h.startsWith("반말")) return `${h} — 선생님에게 '~야', '~어', '~지' 같은 반말을 쓴다. 갑자기 존댓말로 바꾸지 않는다. (반드시 지킬 것)`;
  return `${h} (반드시 지킬 것)`;
}
function studentBlock(s) {
  const sc = schoolOf(s);
  const L = [`- ${s.name} (id: ${s.id})`, `  · 본명: ${s.full_name} / ${sc.name} ${s.year || ""} / 소속: ${s.club || "없음"}`,
    `  · 선생님에게: ${honorificRule(s.honorific)}`,
    `  · 선생님 호칭: '${s.call || "선생님"}' (이 표기 그대로. 선상님·쌤·센세 등으로 바꾸지 말 것)`];
  for (const [label, k] of [["나이", "age"], ["생일", "birthday"], ["키", "height"], ["취미", "hobby"], ["무기", "weapon"],
    ["성격", "personality"], ["말투", "speech"], ["선생님을 대하는 태도", "sensei"], ["인간관계", "relations"], ["배경·스토리", "story"]])
    if (s[k]) L.push(`  · ${label}: ${s[k]}`);
  if (s.detail === "basic") L.push("  · (공개 자료가 적은 학생입니다. 위 정보와 학교·동아리 분위기 안에서 무난하게 연기하고, 과도한 설정을 지어내지 마세요.)");
  const b = bondOf(s.id), st = stageOf(b.affection);
  L.push(`  · 선생님과의 관계: ${st.name} (호감도 ${b.affection}/100) — ${st.guide} 단, 친해져도 존댓말/반말과 말투는 바뀌지 않는다.`);
  if (b.memory) L.push(`  · 이전 만남에서 기억하는 것: ${b.memory}`);
  return L.join("\n");
}

// 현재 장면 = 가장 최근 응답이 남긴 [장면] 태그. 없으면 방을 만들 때 정한 첫 장면.
function currentScene(room) {
  for (let i = room.messages.length - 1; i >= 0; i--) if (room.messages[i].scene) return room.messages[i].scene;
  return room.scene0 || null;
}

// 응답 속 '이름 [감정]: "대사"' 줄에서 실제로 말한 학생 id를 뽑는다 (최근에 말한 순서).
function speakersIn(messages) {
  const ids = [];
  for (const m of [...messages].reverse()) {
    if (m.role !== "assistant") continue;
    for (const line of m.content.split("\n").reverse()) {
      const head = line.match(/^\s*([^:："*]{1,40}?)\s*[:：]\s*["“]/);
      const st = head && findStudentByName(splitSpeaker(head[1]).who);
      if (st && !ids.includes(st.id)) ids.push(st.id);
    }
  }
  return ids;
}
// 상세 프로필을 넣을 학생. 우선순위: 지금 장면에 있는 학생 → 최근 6개 응답에서 실제로 말한 학생 → 방의 고정 학생 → 최근 대화에 이름만 나온 학생.
// (예전에는 장면 태그와 '최근 2개 메시지'만 봐서, AI가 태그를 빠뜨리면 말하고 있는 학생의 프로필이 빠져 성격이 뒤바뀌었다)
function focusStudents(room) {
  const ids = [...(currentScene(room)?.present || []), ...speakersIn(room.messages.slice(-6)), ...room.student_list];
  const recent = room.messages.slice(-2).map((m) => m.content).join("\n");
  for (const s of Object.values(state.students)) if (s.name.length >= 2 && recent.includes(s.name)) ids.push(s.id);
  return [...new Set(ids)].filter((i) => state.students[i]).slice(0, 10).map((i) => state.students[i]);
}

// 자유 모드용 전체 학생 요약 명부 (id|이름|학교|소속|말투 앞부분)
function rosterDigest() {
  return Object.values(state.students).map((s) => {
    const speech = (s.speech || "").split(/[.。]/)[0].slice(0, 50);
    const trait = (s.personality || "").split(/[.。]/).slice(1, 2).join("").trim().slice(0, 45); // 첫 문장(소속 소개) 다음 문장 = 성격 핵심
    return `${s.id}|${s.name}|${schoolOf(s).name}|${s.club || "무소속"}|선생님에게 ${s.honorific || "존댓말"}|호칭 '${s.call || "선생님"}'|${speech}${trait ? "|" + trait : ""}`;
  }).join("\n");
}

function buildSystem(room) {
  const studs = focusStudents(room);
  const parts = [CORE_RULES, "[세계관 핵심]\n" + state.world.prompt_summary];
  parts.push(state.profile.sensei_name ? `선생님의 이름은 '${state.profile.sensei_name}'입니다. 학생들은 대개 그냥 '선생님'이라고 부릅니다.` : "학생들은 유저를 '선생님'이라고 부릅니다.");
  const schoolIds = [...new Set(studs.map((s) => s.school))];
  parts.push("[관련 학교]\n" + schoolIds.map((id) => state.schools[id]).filter(Boolean).map((s) => `- ${s.full_name}: ${s.summary}`).join("\n"));
  parts.push("[등장 학생 상세 프로필]\n" + (studs.length ? studs.map(studentBlock).join("\n") : "(아직 만난 학생이 없습니다)"));
  if (room.mode === "free") {
    const place = state.world.places.find((p) => p.id === room.place_id);
    parts.push(`[자유 모드]
선생님이 키보토스를 자유롭게 돌아다니며 학생들을 만납니다. 당신은 내레이터이자 모든 인물입니다.
- 지금 장소에 있을 법한 학생만 등장시키세요. 그 학원 학생이거나, 그 장소에 올 이유(동아리 활동, 심부름, 샬레 당번 등)가 있어야 합니다.
- 한 응답에 새로 등장하는 학생은 많아야 2명입니다. 위 상세 프로필이 없는 학생이 처음 나올 때는 아래 [학생 명부]의 정보 안에서 짧게 등장시키세요. 다음 응답부터 상세 프로필이 주어집니다.
- 학생은 아래 명부에 있는 학생만 등장시킵니다. 명부에 없는 이름의 학생을 만들지 마세요(이름 없는 엑스트라 학생이나 로봇 시민은 괜찮습니다).
- 선생님이 다른 곳으로 가면 그곳에 맞는 학생으로 자연스럽게 바뀌고, 떠난 학생은 [장면]의 등장 목록에서 빠집니다.
시작 장소: ${place?.name || room.place_name || "샬레 집무실"} — ${place?.desc || ""}

[학생 명부] (형식: id|이름|학교|소속|선생님에게 쓰는 높임|호칭|말투|성격)
${rosterDigest()}`);
  } else if (room.mode === "story") {
    const sc = state.scenarios.find((x) => x.id === room.scenario_id) || {};
    parts.push(`[스토리 모드]\n당신은 내레이터이자 모든 등장인물입니다. 장면을 묘사하고 여러 학생이 서로 대화하게 하세요.\n학생마다 말투를 확실히 구분하고, 한 응답에 모든 학생을 억지로 등장시키지 않아도 됩니다.\n시나리오: ${sc.title || "자유 시나리오"}\n장소: ${sc.location || ""}\n개요: ${sc.summary || ""}`);
  } else if (studs[0]) {
    parts.push(`[1:1 대화 모드]\n당신은 ${studs[0].name}입니다. 선생님과 단둘이 나누는 대화가 중심입니다. 필요하면 지문으로 주변 상황을 묘사할 수 있지만, 다른 학생은 꼭 필요할 때만 잠깐 등장시킵니다.`);
    if (room.outfit) parts.push(`[현재 차림] ${room.outfit} — ${state.world.outfit_contexts[room.outfit] || ""}`);
  }
  if (room.situation) parts.push(`[유저가 정한 상황 설정]\n${room.situation}`);
  if (room.summary) parts.push(`[지금까지의 줄거리 요약]\n${room.summary}`);
  const scene = currentScene(room);
  if (scene) {
    const who = (scene.present || []).map((i) => state.students[i]?.name).filter(Boolean).join(", ") || "선생님뿐";
    parts.push(`[현재 장면] 장소: ${scene.place || "?"} / 시간: ${scene.time || "?"} / 그 자리에 있는 학생: ${who}\n이 장면에서 바로 이어서 쓰세요.`);
  }
  return parts.join("\n\n");
}

// sample 입력: 설정 전체를 첫 user 턴에 넣고, 이후 대화를 이어 붙인다. 반드시 user 턴으로 끝나야 한다.
// 선생님 입력을 '행동'과 '말'로 나눠 이름표를 붙인다. *별표*를 대사로 착각하지 않도록.
// 예) '"가자." *가방을 챙긴다*' → '[선생님의 말] "가자."\n[선생님의 행동] 가방을 챙긴다'
// 표시가 하나도 없으면 그대로 두고 AI가 문맥으로 판단하게 한다. 화면·저장 내용은 바뀌지 않는다.
function labelUserInput(text) {
  if (!/[*"“”]/.test(text)) return text;
  const out = [];
  // *행동*(닫는 별표가 없으면 끝까지), "말", 그 밖의 글자 덩어리 순서대로 자른다
  for (const [, act, said, rest] of text.matchAll(/\*([^*]+)(?:\*|$)|["“]([^"”]*)(?:["”]|$)|([^*"“”]+)/g)) {
    if (act?.trim()) out.push(`[선생님의 행동] ${act.trim()}`);
    else if (said?.trim()) out.push(`[선생님의 말] "${said.trim()}"`);
    else if (rest?.trim()) out.push(`[선생님의 말] "${rest.trim()}"`);
  }
  return out.join("\n") || text;
}
function buildTurns(room) {
  const turns = [{ role: "user", content: buildSystem(room) + "\n\n위 설정에 따라 롤플레이를 진행하세요. 이후 '선생님'의 메시지는 유저가 직접 입력한 것입니다." }];
  for (const m of room.messages.slice(room.summarized_count)) turns.push({ role: m.role, content: m.role === "user" ? labelUserInput(m.content) : koreanizeNames(m.content) });
  if (turns.length === 1)
    turns.push({ role: "user", content: "(선생님이 막 이곳에 도착했다. 장면을 시작해 주세요.)" });
  else if (turns.at(-1).role === "assistant")
    turns.push({ role: "user", content: "(선생님은 잠시 말없이 지켜본다. 새 사건을 만들지 말고, 지금 장면 안에서 인물들의 반응을 자연스럽게 이어 주세요.)" });
  const memo = [profileChangeNote(room), castReminder(room)].filter(Boolean).join("\n\n");
  if (memo) turns.at(-1).content += "\n\n" + memo;
  return turns;
}

// ───────── 설정이 바뀐 뒤의 예전 대화방 ─────────
// 예전 대화방에는 옛 설정으로 쓰인 답장이 수십 개 쌓여 있어서, AI가 새 프로필보다 그 '예시'를 따라 한다.
// 그래서 방마다 학생 설정의 지문(fingerprint)을 기억해 두고, 바뀐 학생이 있으면 한동안(20턴) 안내를 붙인다.
const NOTE_TURNS = 20;
const profileFp = (s) => [s.honorific, s.call, (s.speech || "").slice(0, 60), (s.relations || "").slice(0, 40)].join("|");
function profileChangeNote(room) {
  const now = room.messages.length;
  const studs = focusStudents(room);
  room.fpNotes = room.fpNotes || {};
  if (!room.fp) { // 이 기능이 생기기 전에 만든 방: 옛 설정을 알 수 없으므로, 그때까지 말한 적 있는 학생은 '바뀌었을 수 있음'으로 본다
    room.fp = {};
    room.fpLegacy = speakersIn(room.messages);
  }
  for (const s of studs) {
    const fp = profileFp(s);
    if (room.fp[s.id] ? room.fp[s.id] !== fp : (room.fpLegacy || []).includes(s.id)) room.fpNotes[s.id] = now;
    room.fp[s.id] = fp;
  }
  const changed = studs.filter((s) => room.fpNotes[s.id] != null && now - room.fpNotes[s.id] < NOTE_TURNS);
  if (!changed.length) return "";
  return `(설정 업데이트 안내 — 선생님의 말이 아님) ${changed.map((s) => s.name).join(", ")}의 설정이 이 대화가 시작된 뒤 바뀌었을 수 있습니다. ` +
    "앞선 대화와 줄거리 요약에 나온 이 학생들의 말투·호칭·성격·관계는 옛 설정이니 따라 하지 말고, 지금의 [등장 학생 상세 프로필]과 아래 메모대로 연기하세요. 말투가 바뀐 이유를 이야기 속에서 설명하지 말고 자연스럽게 이어 가세요.";
}
// 대화가 길어지면 AI는 맨 앞 프로필보다 바로 앞의 자기 답장을 따라 하며 성격이 조금씩 흘러간다.
// 그래서 매 턴 마지막 메시지 끝에, 지금 장면 인물의 핵심 설정을 짧게 다시 붙인다(화면에는 보이지 않음).
function castReminder(room) {
  const studs = focusStudents(room).slice(0, 6);
  if (!studs.length) return "";
  const first = (txt, n) => (txt || "").split(/[.。]/)[0].trim().slice(0, n);
  const line = (s) => `- ${s.name}: 선생님에게 ${(s.honorific || "존댓말").split(" (")[0]}, 호칭 '${(s.call || "선생님").split(" (")[0]}'. ${first(s.speech, 70)}.${s.relations ? " 관계: " + first(s.relations, 50) + "." : ""}`;
  return `(시스템 메모 — 선생님의 말이 아님. 이번 응답에서 반드시 지킬 인물 설정. 앞선 답장의 말투가 달라도(설정이 바뀌기 전 기록일 수 있음) 아래와 프로필이 기준입니다)\n${studs.map(line).join("\n")}`;
}

// ───────── 호감도·기억 (Python app/memory.py 를 옮긴 것) ─────────
const TAG = /\[호감도\s+([\w*]+)\s*:\s*([+-]?\d+)\]/g;
const SCENE_TAG = /\[장면\s+([^\]]*)\]/g;

// 응답에서 내부 태그를 떼어 내고 {보이는 글, 호감도 변화, 장면}을 돌려준다.
function parseReply(raw) {
  const changes = {};
  for (const [, sid, d] of raw.matchAll(TAG)) changes[sid] = Math.max(-5, Math.min(5, parseInt(d, 10))); // AI가 범위를 넘겨도 ±5로 자른다
  let scene = null;
  for (const [, body] of raw.matchAll(SCENE_TAG)) {
    const field = (name) => (body.match(new RegExp(name + "\\s*[:：]\\s*([^|]*)")) || [])[1]?.trim() || "";
    const present = field("등장").split(/[,，\s]+/).map((x) => x.trim().toLowerCase()).filter((x) => state.students[x]);
    scene = { place: field("장소").slice(0, 60), time: field("시간").slice(0, 30), present: [...new Set(present)].slice(0, 8) };
  }
  return { text: koreanizeNames(raw.replace(TAG, "").replace(SCENE_TAG, "").trim()), changes, scene };
}
// 스트리밍 중에는 반쯤 쓰인 태그(끝부분의 '[호감도…', '[장면…')도 숨긴다.
const visibleText = (t) => koreanizeNames(t.replace(TAG, "").replace(SCENE_TAG, "").replace(/\[(호|장|호감|장면|호감도)?[^\]\n]{0,120}$/, "").trim());

// 명부에 있는 학생이라면 누구든 호감도가 반영된다 (자유 모드에서 새로 만난 학생 포함).
function applyAffection(room, changes, sign = 1) {
  const applied = {};
  for (const [sid, d] of Object.entries(changes)) {
    if (!state.students[sid] || !d) continue; // 명부에 없는 id를 AI가 지어내면 무시
    const b = { ...bondOf(sid) };
    b.affection = Math.max(0, Math.min(100, b.affection + sign * d));
    state.bonds[sid] = b; applied[sid] = d;
  }
  return applied;
}

const SUMMARY_TRIGGER = 30, KEEP_RECENT = 12, MAX_STORED = 160;

async function maybeSummarize(room) {
  const pending = room.messages.slice(room.summarized_count);
  if (pending.length <= SUMMARY_TRIGGER || !state.sample) return;
  const chunk = pending.slice(0, pending.length - KEEP_RECENT);
  const cast = [...new Set([...room.student_list, ...(room.met || [])])].filter((i) => state.students[i]).slice(0, 30);
  const names = cast.map((i) => `${state.students[i].name}(${i})`).join(", ");
  const mems = cast.map((i) => `- ${i}: ${bondOf(i).memory || "(없음)"}`).join("\n");
  const prompt = `당신은 롤플레이 기록을 정리하는 서기입니다. 등장 학생: ${names}
아래 대화를 읽고 JSON 하나만 출력하세요.
{"room_summary": "기존 요약과 새 대화를 합친 줄거리 요약. 사건 순서, 약속, 현재 상황 위주로 8문장 이내", "student_memories": {"학생id": "이 학생이 다음 만남에도 기억할 만한 선생님과의 핵심 사실 (2문장 이내)"}}

  try {

    room.summarized_count += chunk.length;

// ───────── 대화방 저장 ─────────
async function saveRoom(room) {
  // 문서 하나의 크기 제한(256KB) 때문에, 이미 요약된 오래된 메시지부터 덜어 낸다.
  const drop = Math.min(Math.max(0, room.messages.length - MAX_STORED), room.summarized_count);
  if (drop) { room.messages.splice(0, drop); room.summarized_count -= drop; }
  room.updated_at = nowIso();
  const meta = { id: room.id, title: room.title, mode: room.mode, student_list: room.mode === "free" ? (room.met || []) : room.student_list, updated_at: room.updated_at };
  state.rooms = [meta, ...state.rooms.filter((r) => r.id !== room.id)];
  renderRooms();
  await store.set("room-" + room.id, room);
  await store.set("roomindex", { rooms: state.rooms });
}

    <label for="pick-q">함께할 학생 (최대 6명)<input id="pick-q" type="search" placeholder="이름으로 찾아 추가"></label>

async function createRoom({ mode, student_ids = [], outfit = "", scenario_id = "", situation = "", place_id = "", meet = "" }) {
  const first = state.students[student_ids[0]];
  const sc = scenario_id ? state.scenarios.find((x) => x.id === scenario_id) : null;
  const place = place_id ? state.world.places.find((p) => p.id === place_id) : null;
  const room = {
    id: newId(), mode, student_list: student_ids, outfit, scenario_id, situation, summary: "", summarized_count: 0,
    title: mode === "story" ? (sc?.title || "자유 스토리") : mode === "free" ? `자유 모드 · ${place?.name || "키보토스"}`
      : first.name + (outfit ? ` (${outfit})` : ""),
    messages: sc?.opening ? [{ role: "assistant", content: sc.opening, affection: {} }] : [],
  };
  if (mode === "free") {
    room.place_id = place_id;
    room.met = meet ? [meet] : [];
    room.scene0 = { place: place?.name || "", time: "", present: meet ? [meet] : [] };
    if (meet) room.situation = `선생님은 ${state.students[meet].name}을(를) 만나러 왔다. ${situation}`.trim();
  } else if (sc?.opening) {
    room.scene0 = { place: sc.location, time: "", present: sc.students.filter((i) => student_ids.includes(i)) };
  }
  for (const sid of student_ids) if (!state.bonds[sid]) state.bonds[sid] = { affection: 20, memory: "" };
  showView("chat"); state.room = room; renderChat();
  await saveRoom(room);
  if (!room.messages.length) runTurn("continue"); // 오프닝이 없으면 학생이 먼저 말을 건다
}

async function openRoom(id) {
  const room = await store.get("room-" + id);
  if (!room) { toast("대화를 불러오지 못했습니다."); state.rooms = state.rooms.filter((r) => r.id !== id); renderRooms(); return; }
  showView("chat"); state.room = room; renderChat(); renderRooms();
}

// ───────── 채팅 그리기 ─────────
function renderAssistant(text) {
  return text.split(/\n+/).filter((l) => l.trim()).map((raw) => {
    const line = raw.trim();
    const narr = line.match(/^\*(.+)\*$/);
    if (narr) return `<p class="narr">${esc(narr[1])}</p>`;
    const talk = line.match(/^([^:："*]{1,28})[:：]\s*["“](.*?)["”]?$/);
    if (talk) {
      const { who, emo } = splitSpeaker(talk[1]);
      const st = findStudentByName(who);
      const face = st ? halo(st) : `<span class="halo"><span class="face" aria-hidden="true">${esc(who[0] || "?")}</span></span>`;
      const mark = EMOTES[emo] ? `<span class="emote" role="img" aria-label="${esc(emo)}" title="${esc(emo)}">${EMOTES[emo]}</span>` : "";
      return `<div class="line"><span class="face-wrap">${face}${mark}</span><div class="bubble" ${st ? `style="--school:${schoolOf(st).color}"` : ""}><b>${esc(st ? st.name : who)}</b>${esc(talk[2])}</div></div>`;
    }
    return `<p class="plain">${esc(line)}</p>`;
  }).join("");
}
function affectionNote(aff) {
  const p = Object.entries(aff || {}).filter(([, d]) => d).map(([id, d]) => `${state.students[id]?.name ?? id} ${d > 0 ? "+" : ""}${d}`);
  return p.length ? `<span class="affection-note">호감도 ${esc(p.join(", "))}</span>` : "";
}
// data-i = room.messages 안의 위치. 메시지를 누르면 이 번호로 삭제 대상을 찾는다.
const messageHtml = (m, i) => m.role === "user" ? `<li class="msg user" data-i="${i}">${esc(m.content)}</li>`
  : `<li class="msg assistant" data-i="${i}">${renderAssistant(m.content)}${affectionNote(m.affection)}</li>`;

function renderChatHead() {
  const room = state.room, scene = currentScene(room);
  // 자유 모드는 지금 장면에 있는 학생, 나머지는 방에 고정된 학생을 보여 준다.
  const ids = room.mode === "free" ? (scene?.present || []) : room.student_list;
  const studs = ids.map((i) => state.students[i]).filter(Boolean);
  $("#chat-halos").innerHTML = studs.slice(0, 4).map((s) => halo(s, "big")).join("");
  $("#chat-title").textContent = room.title;
  $("#topbar-title").textContent = room.title;
  let sub;
  if (room.mode === "single" && studs[0]) sub = `${stageOf(bondOf(studs[0].id).affection).name} · 호감도 ${bondOf(studs[0].id).affection}`;
  else sub = [scene?.place, scene?.time].filter(Boolean).join(" · ") + (studs.length ? ` — ${studs.map((s) => `${s.name} ${bondOf(s.id).affection}`).join(", ")}` : "");
  $("#chat-sub").textContent = sub || "장면을 준비하는 중";
}

function renderChat({ keepScroll = false } = {}) {
  clearSelection(); // 다시 그리면 메시지 번호가 바뀔 수 있으므로 선택을 푼다
  renderChatHead();
  const room = state.room, box = $("#messages"), top = box.scrollTop;
  box.innerHTML = room.messages.length ? room.messages.map(messageHtml).join("") : `<li class="empty">첫 마디를 건네 보세요.</li>`;
  if (keepScroll) { box.scrollTop = top; updateJump(); } else scrollDown();
}

// ───────── 메시지 삭제: 메시지를 누르면 입력칸 위에 '삭제' 막대가 나온다 ─────────
let selected = -1;
function clearSelection() {
  selected = -1;
  document.querySelectorAll(".msg.selected").forEach((el) => el.classList.remove("selected"));
  $("#msg-bar").hidden = true;
}
$("#messages").addEventListener("click", (e) => {
  if (e.target.closest("[data-retry-quick]")) { // '빠른 모델로 다시 시도' (claude.ai 전용)
    $("#tier").value = "quick";
    e.target.closest(".error-line")?.remove();
    toast("응답 방식을 '빠르게'로 바꿔 다시 시도합니다.");
    return runTurn("continue");
  }
  const li = e.target.closest(".msg[data-i]");
  const same = li && Number(li.dataset.i) === selected;
  clearSelection();
  if (!li || same || state.busy) return; // 같은 메시지를 다시 누르면 선택 해제
  selected = Number(li.dataset.i);
  li.classList.add("selected");
  const m = state.room.messages[selected];
  $("#msg-bar-label").textContent = m.role === "user" ? "내 메시지를 선택했습니다" : "답장을 선택했습니다";
  $("#msg-bar").hidden = false;
});
$("#msg-cancel").onclick = clearSelection;
$("#msg-del").onclick = () => { const i = selected; clearSelection(); deleteMessage(i); };

async function deleteMessage(i) {
  const room = state.room;
  if (!room || state.busy || !room.messages[i]) return;
  const [m] = room.messages.splice(i, 1);
  applyAffection(room, m.affection || {}, -1); // 지운 답장으로 올랐던 호감도는 되돌린다
  if (i < room.summarized_count) room.summarized_count--; // 이미 기억으로 정리된 메시지였다면 개수만 맞춘다
  renderChat({ keepScroll: true });
  await Promise.all([saveRoom(room), store.set("bonds", { bonds: state.bonds })]);
  toast(m.role === "user" ? "내 메시지를 삭제했습니다." : "답장을 삭제했습니다.");
}

// ───────── 입력 도우미: " " / * * 넣기 (선택한 글자가 있으면 감싸기) ─────────
document.querySelectorAll("[data-wrap]").forEach((btn) => {
  btn.addEventListener("pointerdown", (e) => e.preventDefault()); // 누를 때 입력칸 포커스가 빠져 키보드가 닫히지 않게
  btn.onclick = () => {
    const box = $("#input"), mark = btn.dataset.wrap;
    const { selectionStart: a, selectionEnd: b, value } = box;
    const picked = value.slice(a, b);
    box.setRangeText(mark + picked + mark, a, b, "end");
    if (!picked) box.setSelectionRange(a + 1, a + 1); // 빈칸이면 커서를 기호 사이로
    box.focus();
  };
});

// 스크롤: 맨 아래로 / 새 답장의 시작 위치만 보이게 / 아래에 내용이 남았으면 버튼 표시
function scrollDown() { const b = $("#messages"); b.scrollTop = b.scrollHeight; updateJump(); }
function revealStart(el) {
  const box = $("#messages");
  if (!el) return;
  const top = el.offsetTop - box.offsetTop;
  // 답장 시작이 화면 위쪽 1/4 지점 근처에 오도록 (직전 내 메시지가 위에 살짝 보이게)
  if (top > box.scrollTop + box.clientHeight * 0.4 || top < box.scrollTop) box.scrollTop = top - box.clientHeight * 0.25;
  updateJump();
}
function updateJump() {
  const b = $("#messages");
  $("#jump").hidden = b.scrollHeight - b.scrollTop - b.clientHeight < 80;
}
$("#messages").addEventListener("scroll", updateJump, { passive: true });
$("#jump").onclick = () => $("#messages").scrollTo({ top: $("#messages").scrollHeight, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });

function setBusy(on) {
  state.busy = on;
  if (on) clearSelection();
  ["#btn-continue", "#btn-regen", "#btn-undo"].forEach((s) => ($(s).disabled = on));
  $("#send").textContent = on ? "멈추기" : "보내기";
}

const ERROR_TEXT = {
  bad_key: "API 키가 올바르지 않거나 권한이 없습니다. 'AI 설정'에서 키를 확인하세요.",
  bad_model: "모델 이름을 찾을 수 없습니다. 'AI 설정'에서 모델 이름을 확인하세요.",
  not_granted: "Claude 사용이 허용되지 않았습니다. 페이지를 새로 열면 다시 물어봅니다.",
  sampling_disabled: "이 계정에서는 Claude 응답을 쓸 수 없습니다.",
  rate_limited: "요청이 너무 많거나 사용 한도에 닿았습니다. 잠시 뒤 다시 시도하세요.",
  overloaded: "AI 서버가 붐벼서 답하지 못했습니다. 잠시 뒤 다시 시도하세요.",
  timeout: "AI가 너무 오래 답하지 않아 중단했습니다. 다시 시도하거나 'AI 설정'에서 다른 모델을 골라 보세요.",
  session_expired: "claude.ai에 다시 로그인한 뒤 시도하세요.",
  refused: "이 내용에는 답할 수 없습니다. 다른 방향으로 이야기를 이어 보세요.",
  prompt_too_large: "대화가 너무 깁니다. 되돌리기로 몇 턴을 지우거나 새 대화를 시작하세요.",
  empty_completion: "응답이 비어 있습니다. 다시 생성해 보세요.",
};

// kind: "send" | "continue" | "regenerate"
async function runTurn(kind) {
  const room = state.room;
  if (!room || state.busy) return;
  if (!state.sample) {
    if (!IN_CLAUDE) {
      $("#messages").insertAdjacentHTML("beforeend", `<li class="error-line">AI를 쓰려면 API 키가 필요합니다. 메뉴 아래쪽 'AI 설정'에서 키를 넣은 뒤 '이어서'를 눌러 주세요.</li>`);
      scrollDown(); openAiSheet(); return;
    }
    $("#messages").insertAdjacentHTML("beforeend", `<li class="error-line">이 화면에서는 AI 응답을 쓸 수 없습니다. claude.ai 앱이나 웹에서 이 페이지를 열어 주세요.</li>`);
    return scrollDown();
  }
  if (kind === "regenerate") {
    const last = room.messages.at(-1);
    if (!last || last.role !== "assistant" || room.messages.length <= room.summarized_count) return toast("다시 생성할 응답이 없습니다.");
    applyAffection(room, last.affection || {}, -1);
    room.messages.pop(); renderChat();
  }
  const ctl = new AbortController(); state.ctl = ctl;
  setBusy(true);
  $("#messages").querySelector(".empty")?.remove();
  $("#messages").insertAdjacentHTML("beforeend", `<li class="msg assistant" id="live"><span class="status-line">답장을 쓰는 중…</span></li>`);
  // 첫 글자가 나올 때까지 경과 시간을 보여 준다. 생각이 긴 모델은 수십 초 걸릴 수 있어서, 멈춘 게 아니라는 걸 알리기 위해서다.
  const startedAt = Date.now();
  const ticker = setInterval(() => {
    const st = $("#live .status-line");
    if (!st || $("#live").children.length > 1) return;
    const sec = Math.round((Date.now() - startedAt) / 1000);
    st.textContent = st.textContent.replace(/(\s*\d+초)?$/, ` ${sec}초`);
  }, 1000);
  // 답장 자리를 미리 확보하고 시작 부분까지만 한 번 내려 준다. 써지는 동안에는 화면을 움직이지 않는다.
  $("#live").style.minHeight = Math.round($("#messages").clientHeight * 0.6) + "px";
  revealStart($("#live"));
  try {
    const opts = {
      cache: false, signal: ctl.signal, modelTier: $("#tier").value,
      onText: ({ text }) => { const live = $("#live"); if (live && state.room === room) { live.innerHTML = renderAssistant(visibleText(text)); updateJump(); } },
    };
    // 직접 호출(GitHub Pages)일 때만: 모델을 바꿔 다시 시도하는 중이라는 것을 말풍선에 보여 준다
    if (!IN_CLAUDE) opts.onStatus = (msg) => { const live = $("#live"); if (live) live.innerHTML = `<span class="status-line">${esc(msg)}</span>`; };
    const { text: raw, truncated, fallback } = await state.sample(buildTurns(room), opts);
    if (fallback) toast(`${fallback.from} 사용 한도 때문에 ${fallback.to}(으)로 바꿨습니다. 앞으로 이 모델을 계속 씁니다. 원래 모델로 돌아가려면 'AI 설정'에서 저장하세요.`);
    const { text, changes, scene } = parseReply(raw);
    const applied = applyAffection(room, changes);
    const msg = { role: "assistant", content: text || "*(응답이 비어 있습니다. 다시 생성해 보세요.)*", affection: applied };
    if (scene) msg.scene = scene;
    room.messages.push(msg);
    if (room.mode === "free") {
      room.met = [...new Set([...(room.met || []), ...(scene?.present || []), ...Object.keys(applied)])];
      for (const sid of room.met) if (!state.bonds[sid]) state.bonds[sid] = { affection: 20, memory: "" };
    }
    if (state.room === room) {
      // 전체를 다시 그리지 않고, 쓰던 말풍선만 완성본으로 바꾼다 (읽던 위치 유지)
      const live = $("#live");
      if (live) { live.outerHTML = messageHtml(msg, room.messages.length - 1); } else renderChat();
      renderChatHead();
      Object.keys(applied).forEach((id) => document.querySelectorAll(`[data-halo="${id}"]`).forEach((h) => h.classList.add("bump")));
      updateJump();
      if (truncated) toast("응답이 길어 중간에 끊겼습니다. '이어서 진행'을 눌러 보세요.");
    }
    await Promise.all([saveRoom(room), store.set("bonds", { bonds: state.bonds })]);
    maybeSummarize(room);
  } catch (e) {
    const keep = e?.text ? visibleText(e.text) : "";
    if (keep && e.code !== "refused") { // 끊긴 응답이라도 쓰인 부분은 남긴다
      room.messages.push({ role: "assistant", content: keep, affection: {} });
      await saveRoom(room);
    }
    if (state.room === room) {
      renderChat();
      if (e?.code !== "cancelled") {
        let text = ERROR_TEXT[e?.code] || "응답을 받지 못했습니다. 잠시 뒤 다시 시도하세요.";
        if (!IN_CLAUDE && e?.code === "rate_limited") text = "쓸 수 있는 모델을 모두 바꿔 봤지만 전부 사용 한도에 닿았습니다. 잠시 뒤 다시 시도하거나 'AI 설정'에서 다른 회사의 키를 넣어 주세요.";
        // claude.ai에서는 페이지가 스스로 재시도하면 안 되므로, 사용자가 누르는 버튼으로 더 가벼운 모델에서 다시 시도하게 한다
        const retry = IN_CLAUDE && e?.code === "rate_limited" && $("#tier").value !== "quick"
          ? ` <button type="button" class="btn ghost" data-retry-quick>빠른 모델로 다시 시도</button>` : "";
        $("#messages").insertAdjacentHTML("beforeend", `<li class="error-line">${esc(text)}${retry}</li>`);
        scrollDown();
      }
    }
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") state.sample = null;
  } finally {
    clearInterval(ticker);
    if (state.ctl === ctl) state.ctl = null;
    setBusy(false);
  }
}

$("#composer").onsubmit = async (e) => {
  e.preventDefault();
  if (state.busy) { state.ctl?.abort(); return; } // 응답 중에는 '멈추기' 버튼
  const text = $("#input").value.trim();
  if (!text || !state.room) return;
  $("#input").value = "";
  state.room.messages.push({ role: "user", content: text, affection: {} });
  renderChat();
  await saveRoom(state.room);
  runTurn("send");
};
$("#input").onkeydown = (e) => {
  // 모바일 키보드의 Enter는 줄바꿈으로 두고, 전송은 버튼으로 한다.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(hover: hover)").matches) { e.preventDefault(); $("#composer").requestSubmit(); }
};
$("#btn-continue").onclick = () => runTurn("continue");
$("#btn-regen").onclick = () => runTurn("regenerate");
$("#btn-undo").onclick = async () => {
  const room = state.room; if (!room || state.busy) return;
  let removed = false;
  while (room.messages.length > room.summarized_count) {
    const m = room.messages.pop(); removed = true;
    applyAffection(room, m.affection || {}, -1);
    if (m.role === "user") break;
  }
  if (!removed) return toast("되돌릴 대화가 없습니다.");
  renderChat();
  await Promise.all([saveRoom(room), store.set("bonds", { bonds: state.bonds })]);
};
// 브라우저 confirm()은 이 화면에서 동작하지 않아서 시트로 확인한다.
$("#delete-room").onclick = () => {
  const room = state.room; if (!room) return;
  $("#sheet-body").innerHTML = `<h2>대화 삭제</h2><p>'${esc(room.title)}' 대화를 삭제할까요? 되돌릴 수 없습니다. 학생들의 호감도와 기억은 그대로 남습니다.</p>
    <div class="sheet-actions"><button class="btn ghost" value="cancel">취소</button><button class="btn primary" id="confirm-del">삭제</button></div>`;
  $("#confirm-del").onclick = async (e) => {

    await store.set("roomindex", { rooms: state.rooms });
    toast("대화를 삭제했습니다.");
  };

};

// ───────── 직접 AI 호출 (claude.ai 밖, 예: GitHub Pages) ─────────
// claude.ai의 sample(turns, {onText, signal})과 같은 모양으로 만들어서, 채팅 코드는 그대로 쓴다.
// API 키는 방문자 브라우저(localStorage)에만 저장되고 어디에도 올라가지 않는다.
const AI_PROVIDERS = {
  gemini: { label: "Gemini (Google)", model: "gemini-3.6-flash", keyHelp: "aistudio.google.com 에서 발급" },
  claude: { label: "Claude (Anthropic)", model: "claude-sonnet-5-5", keyHelp: "console.anthropic.com 에서 발급 (유료)" },
  openai: { label: "OpenAI", model: "gpt-6-luna", keyHelp: "platform.openai.com 에서 발급 (유료)" },
};
// active: 한도 때문에 바꿔 탄 모델. 한 번 바꾸면 'AI 설정'을 다시 저장하기 전까지 계속 이 모델을 쓴다.
let aiConfig = { provider: "gemini", key: "", model: "", active: "" };

function loadAiConfig() {
  try { aiConfig = { ...aiConfig, ...JSON.parse(localStorage.getItem("kc:ai") || "{}") }; } catch { /* 저장소를 못 쓰면 이번 방문 동안만 기억 */ }
}
function saveAiConfig() {
  try { localStorage.setItem("kc:ai", JSON.stringify(aiConfig)); } catch { toast("이 브라우저는 설정을 저장할 수 없어, 창을 닫으면 키를 다시 넣어야 합니다."); }
}
function initDirectAI() {

  $("#tier").hidden = true; // 응답 방식(기본/빠르게)은 claude.ai 전용. 여기서는 'AI 설정'의 모델이 결정한다.
  state.sample = aiConfig.key ? createDirectSample() : null;
  renderAiStatus();
}
function renderAiStatus() {
  const model = aiConfig.active || aiConfig.model || AI_PROVIDERS[aiConfig.provider].model;
  $("#ai-status").textContent = aiConfig.key ? `${model} 사용 중` : "AI 미설정";
}

function openAiSheet() {

    <label for="f-provider">AI 회사

// 첫 user 턴(설정 전체)은 시스템 지시로, 나머지는 대화로 나눈다. API들은 'user로 시작, 역할 번갈아'를 요구한다.
function splitTurns(turns) {
  const system = turns[0].content;
  const rest = [];
  for (const t of turns.slice(1)) {
    if (rest.length && rest.at(-1).role === t.role) rest.at(-1).content += "\n\n" + t.content;
    else rest.push({ role: t.role, content: t.content });
  }
  if (!rest.length || rest[0].role !== "user") rest.unshift({ role: "user", content: "(이야기를 시작해 주세요.)" });
  return { system, rest };
}

function directRequest({ provider, key, model }, system, rest, stream) {
  model = model || AI_PROVIDERS[provider].model;
  if (provider === "gemini") {
    const path = stream ? "streamGenerateContent?alt=sse" : "generateContent";
    return { url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:${path}`,
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: { systemInstruction: { parts: [{ text: system }] },
        contents: rest.map((t) => ({ role: t.role === "assistant" ? "model" : "user", parts: [{ text: t.content }] })),
        // 3.x Flash는 답하기 전에 '생각'을 하고, 그 분량도 이 제한에 포함된다. 너무 작으면 답장 쓸 몫이 모자라 빈 응답이 된다.
        generationConfig: { maxOutputTokens: 8192, temperature: 0.9 } } };
  }
  if (provider === "claude") {
    return { url: "https://api.anthropic.com/v1/messages",
      // 브라우저에서 직접 부를 때 Anthropic이 요구하는 헤더 (키가 브라우저에 있다는 것을 인정하는 표시)
      headers: { "Content-Type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: { model, max_tokens: 2000, system, messages: rest, stream } };
  }
  return { url: "https://api.openai.com/v1/chat/completions",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
    body: { model, messages: [{ role: "system", content: system }, ...rest], max_completion_tokens: 4096, stream } };
}

// 스트리밍 조각 하나(SSE의 data: 줄)에서 새로 붙은 글자를 꺼낸다.
function deltaOf(provider, data) {
  if (provider === "gemini") return (data.candidates?.[0]?.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || "").join("");
  if (provider === "claude") return data.type === "content_block_delta" ? data.delta?.text || "" : "";
  return data.choices?.[0]?.delta?.content || "";
}
function wholeOf(provider, data) {
  if (provider === "gemini") return (data.candidates?.[0]?.content?.parts || []).map((p) => p.text || "").join("");
  if (provider === "claude") return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  return data.choices?.[0]?.message?.content || "";
}

function httpError(status, body) {
  const code = status === 401 || status === 403 || /API_KEY_INVALID|invalid.*key|authentication/i.test(body) ? "bad_key"
    : status === 404 ? "bad_model" : status === 429 ? "rate_limited" : status === 413 ? "prompt_too_large"
    : status === 503 || status === 529 ? "overloaded" : "upstream_error";
  return { code, message: `HTTP ${status}: ${body.slice(0, 200)}` };
}

// ───────── 한도에 걸리면 다른 모델로 자동 전환 ─────────
const FALLBACK_CODES = new Set(["rate_limited", "overloaded", "bad_model", "timeout"]); // 이 오류들이면 다음 모델로 넘어간다
const FIRST_DATA_MS = 30 * 1000;      // 첫 응답이 30초 안에 안 오면 포기하고 다음 모델로
const IDLE_MS = 30 * 1000;            // 답장 도중 30초 동안 아무것도 안 오면 끊긴 것으로 본다
// 단종되어 다른 모델로 대신 처리되는 이름. 한도에 걸린 모델과 같은 모델로 연결되므로 대체 후보에서 뺀다.
const RETIRED_MODELS = new Set(["gemini-3.7-flash"]);
const COOLDOWN_MS = 10 * 60 * 1000;   // 대체 모델을 찾을 때, 방금 한도에 걸린 모델은 10분 동안 후보에서 뺀다
const MAX_SWITCHES = 3;               // 한 번 보낼 때 최대 3번까지만 바꿔 본다
const cooldown = {};                  // 모델 이름 → 다시 써도 되는 시각
const STATIC_MODELS = {               // 모델 목록을 못 받아 올 때 쓰는 예비 후보
  gemini: ["gemini-3.6-flash", "gemini-3.5-flash"],
  claude: ["claude-sonnet-5-5", "claude-haiku-5-5"],
  openai: ["gpt-6-luna", "gpt-5.6-luna"],
};
const modelListCache = {};

// 그 API 키로 쓸 수 있는 대화용 모델 목록을 AI 회사에 물어본다 (한 번만, 이후엔 기억해 둔 값)
async function listModels(cfg) {
  const cacheKey = cfg.provider + ":" + cfg.key.slice(-6);
  if (modelListCache[cacheKey]) return modelListCache[cacheKey];
  let ids = [];
  try {
    if (cfg.provider === "gemini") {
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": cfg.key }, signal: AbortSignal.timeout(8000) });
      const data = await res.json();
      ids = (data.models || []).filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
        .filter((m) => !/deprecat|retired|discontinued/i.test(`${m.displayName || ""} ${m.description || ""}`))
        .map((m) => m.name.replace(/^models\//, ""))
        .filter((id) => /^gemini-/.test(id) && !/embed|image|tts|audio|live|vision|robotics|computer|native|exp/i.test(id));
      // flash 계열(빠르고 한도가 넉넉한 편)을 먼저, 그다음 pro. 같은 계열은 버전이 높은 순서
      const ver = (id) => parseFloat((id.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0);
      ids.sort((a, b) => (/flash/.test(b) - /flash/.test(a)) || (ver(b) - ver(a)) || a.localeCompare(b));
    } else if (cfg.provider === "claude") {
      const res = await fetch("https://api.anthropic.com/v1/models?limit=100", { headers: {
        "x-api-key": cfg.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, signal: AbortSignal.timeout(8000) });
      const data = await res.json();
      const rank = (id) => (/sonnet/.test(id) ? 0 : /haiku/.test(id) ? 1 : 2);
      ids = (data.data || []).map((m) => m.id).filter((id) => /^claude-/.test(id)).sort((a, b) => rank(a) - rank(b));
    } else {
      const res = await fetch("https://api.openai.com/v1/models", { headers: { Authorization: `Bearer ${cfg.key}` }, signal: AbortSignal.timeout(8000) });
      const data = await res.json();
      ids = (data.data || []).map((m) => m.id)
        .filter((id) => /^gpt-/.test(id) && !/audio|realtime|image|transcribe|tts|search|embed|instruct|codex|moderation/i.test(id))
        .sort().reverse();
    }
  } catch { /* 목록을 못 받으면 예비 후보만 쓴다 */ }
  const merged = [...new Set([...ids, ...STATIC_MODELS[cfg.provider]])].filter((id) => !RETIRED_MODELS.has(id));
  modelListCache[cacheKey] = merged;
  return merged;
}

function createDirectSample() {
  const cfg = { ...aiConfig };
  const primary = cfg.model || AI_PROVIDERS[cfg.provider].model;

  // 이전에 바꿔 탄 모델이 있으면 원래 모델로 돌아가지 않고 그 모델을 계속 쓴다
  const startModel = () => aiConfig.active || primary;

  async function withFallback(turns, opts = {}, stream = true) {
    const tried = new Set();
    const started = startModel();
    let model = started;
    for (let switches = 0; ; switches++) {
      tried.add(model);
      try {
        const result = await call(model, turns, opts, stream);
        if (model !== started) { // 이번에 실제로 모델을 바꿨을 때만: 바꾼 모델을 저장해 두고 알린다
          aiConfig.active = model === primary ? "" : model;
          saveAiConfig(); renderAiStatus();
          result.fallback = { from: started, to: model };
        }
        return result;
      } catch (e) {
        // 답장이 이미 써지기 시작했거나(섞이면 안 됨), 전환할 오류가 아니거나, 사용자가 고른 모델 이름 자체가 틀린 경우는 그대로 알린다
        if (!FALLBACK_CODES.has(e.code) || e.text || (e.code === "bad_model" && model === primary) || switches >= MAX_SWITCHES) throw e;
        if (e.code !== "bad_model") cooldown[model] = Date.now() + COOLDOWN_MS;
        const next = (await listModels(cfg)).find((m) => !tried.has(m) && !(cooldown[m] > Date.now()));
        if (!next) throw e;
        opts.onStatus?.(`${model} ${e.code === "timeout" ? "응답이 너무 늦어" : "사용 한도에 닿아"} ${next}(으)로 다시 시도하는 중…`);
        model = next;
      }
    }
  }

  async function call(model, turns, { onText, signal } = {}, stream = true) {
    // 사용자의 '멈추기'(signal)와 시간 초과를 하나의 AbortController로 묶는다
    const ctl = new AbortController();
    let timedOut = false, timer = 0;
    const arm = (ms) => { clearTimeout(timer); timer = setTimeout(() => { timedOut = true; ctl.abort(); }, ms); };
    const onUserAbort = () => ctl.abort();
    if (signal?.aborted) ctl.abort(); else signal?.addEventListener("abort", onUserAbort, { once: true });
    arm(stream ? FIRST_DATA_MS : FIRST_DATA_MS * 1.5);
    const { system, rest } = splitTurns(typeof turns === "string"
      ? [{ role: "user", content: "당신은 요청한 형식의 JSON만 출력하는 도우미입니다." }, { role: "user", content: turns }] : turns);
    const req = directRequest({ ...cfg, model }, system, rest, stream);
    let text = "";
    try {
      const res = await fetch(req.url, { method: "POST", headers: req.headers, body: JSON.stringify(req.body), signal: ctl.signal });
      if (!res.ok) throw httpError(res.status, await res.text());
      if (!stream) return { text: wholeOf(cfg.provider, await res.json()), truncated: false };
      // 응답 본문을 조금씩 읽어서 'data: {...}' 줄마다 글자를 이어 붙인다 (SSE)
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        arm(text ? IDLE_MS : FIRST_DATA_MS); // 뭔가 오고 있으면 타이머를 다시 건다 (생각 중에는 첫 응답 기준 유지)
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          const s = line.trim();
          if (!s.startsWith("data:")) continue;
          const payload = s.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          let data; try { data = JSON.parse(payload); } catch { continue; }
          if (data.error) throw { code: "upstream_error", message: data.error.message || "stream error" };
          const d = deltaOf(cfg.provider, data);
          if (d) { text += d; onText?.({ text, delta: d }); }
        }
      }
      if (!text.trim()) throw { code: "empty_completion", message: "empty" };
      return { text, truncated: false };
    } catch (e) {
      if (e?.name === "AbortError" || e?.name === "TimeoutError") {
        if (timedOut) throw { code: "timeout", message: `${model} 응답 시간 초과`, text: text || undefined };
        throw { code: "cancelled", message: "cancelled", text };
      }
      if (e?.code) throw { ...e, text: text || undefined };
      throw { code: "upstream_error", message: String(e), text: text || undefined }; // 네트워크 오류 등
    } finally {
      clearTimeout(timer);
      signal?.removeEventListener("abort", onUserAbort);
    }
  }
  const sample = (turns, opts) => withFallback(turns, opts, true);
  sample.json = async (prompt) => {
    const { text } = await withFallback(prompt, {}, false);
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw { code: "invalid_json", message: "no json", text };
    return JSON.parse(m[0]);
  };
  return sample;
}

// ───────── 시작 ─────────
// 명부·스토리·세계관은 데이터가 페이지 안에 있어 바로 그리고, 저장된 대화와 Claude 연결은 뒤이어 붙인다.
renderFilters(); renderRoster(); renderPlaces(); renderScenarios(); renderWorld(); renderMe();
(async () => {
  if (IN_CLAUDE) window.claude.use("sample").then((s) => (state.sample = s)).catch(() => {});
  else initDirectAI();
  await store.init();
  renderSaveNote();
  try {
    const [profile, bonds, index] = await Promise.all([store.get("profile"), store.get("bonds"), store.get("roomindex")]);
    if (profile) state.profile = { ...state.profile, ...profile };
    state.bonds = bonds?.bonds || {};
    state.rooms = index?.rooms || [];
  } catch { toast("저장된 대화를 불러오지 못했습니다. 잠시 뒤 새로 고침해 보세요."); }
  renderMe(); renderRooms(); renderRoster();
})();
</script>
