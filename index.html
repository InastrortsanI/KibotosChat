<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="블루 아카이브 세계관에서 샬레의 선생님이 되어 학생들과 대화하는 AI 롤플레이 채팅 (팬 프로젝트)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>키보토스 채팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽 메뉴(모바일은 서랍) + 오른쪽 화면. 하늘색 바탕에 학교 색 헤일로 */
:root {
  --bg: #eef5fb; --paper: #ffffff; --ink: #1b2a4a; --ink-soft: #5b6b86; --line: #d7e3ef;
  --blue: #1a7fd4; --blue-deep: #1466b0; --on-blue: #ffffff; --halo: #f2c230; --halo-track: #e3ebf3;
  --hover: #f5f9fe; --scrim: rgba(27, 42, 74, .45); --danger: #c93a52; --gold-text: #8a6a00;
  --radius-sm: 6px; --radius-lg: 14px;
  --display: "Do Hyeon", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1828; --paper: #16233a; --ink: #e4ecf8; --ink-soft: #9badc9; --line: #283a58;
  --blue: #2378cc; --blue-deep: #8ccaff; --on-blue: #ffffff; --halo: #f2c230; --halo-track: #2a3b57;
  --hover: #1c2c47; --scrim: rgba(0, 0, 0, .55); --danger: #ff7a8f; --gold-text: #f2c230; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1828; --paper: #16233a; --ink: #e4ecf8; --ink-soft: #9badc9; --line: #283a58;
  --blue: #2378cc; --blue-deep: #8ccaff; --on-blue: #ffffff; --halo: #f2c230; --halo-track: #2a3b57;
  --hover: #1c2c47; --scrim: rgba(0, 0, 0, .55); --danger: #ff7a8f; --gold-text: #f2c230; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 var(--body); -webkit-text-size-adjust: 100%; overflow: hidden; }
h1, h2, .brand { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; line-height: 1.2; }
.muted { color: var(--ink-soft); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.btn { font: 500 .95rem var(--body); border: 0; cursor: pointer; padding: .55rem 1.1rem; border-radius: var(--radius-sm); color: var(--ink); background: transparent; }
.btn.primary { background: var(--blue); color: var(--on-blue); transform: skewX(-10deg); white-space: nowrap; }
.btn.primary:hover { background: var(--blue-deep); }
.btn.ghost { border: 1px solid var(--line); background: var(--paper); }
.btn.ghost:hover { border-color: var(--blue); }
.btn.link { color: var(--blue-deep); padding: .3rem .2rem; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { border: 0; background: none; font-size: 1.2rem; cursor: pointer; color: var(--ink-soft); padding: .3rem .5rem; }

input, textarea, select { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .55rem .7rem; width: 100%; }
input:focus, textarea:focus, select:focus { border-color: var(--blue); outline: none; }

.app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }
.sidebar { background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 1rem; gap: .8rem; }
.sidebar-head { display: flex; justify-content: space-between; align-items: center; }
.brand.small { font-size: 1.35rem; color: var(--blue-deep); }
.tabs { display: grid; gap: .2rem; }
.tab { text-align: left; border: 0; background: none; font: 500 1rem var(--body); padding: .5rem .7rem; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink); }
.tab.active { background: var(--bg); color: var(--blue-deep); box-shadow: inset 3px 0 var(--blue); }
.side-title { font-size: 1rem; color: var(--ink-soft); margin-top: .4rem; }
.room-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: grid; align-content: start; gap: 2px; }
.room-list button { width: 100%; text-align: left; border: 0; background: none; padding: .5rem .6rem; border-radius: var(--radius-sm); cursor: pointer; font: inherit; color: inherit; display: grid; }
.room-list button:hover, .room-list button.active { background: var(--bg); }
.room-meta { font-size: .82rem; color: var(--ink-soft); }
.sidebar-foot { display: grid; gap: .2rem; border-top: 1px solid var(--line); padding-top: .6rem; font-size: .85rem; }
.sidebar-foot .row { display: flex; justify-content: space-between; align-items: center; }
.save-note { font-size: .8rem; color: var(--ink-soft); }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow-y: auto; padding-block: 2rem; padding-inline: clamp(16px, 4vw, 48px); }
.view-head { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1rem; }
.view-head input { max-width: 320px; }
.topbar { display: none; align-items: center; gap: .5rem; padding: .6rem 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar .brand { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.only-mobile { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.2rem; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: .35rem .9rem; font: inherit; font-size: .9rem; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.roster { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: .5rem; }
.roster button { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: .8rem; align-items: center; text-align: left; font: inherit; color: inherit; background: var(--paper); border: 0; border-left: 4px solid var(--school, var(--line)); border-radius: var(--radius-sm); padding: .6rem .8rem; cursor: pointer; }
.roster button:hover { background: var(--hover); }
.who { min-width: 0; }
.who strong { display: block; font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.who span { font-size: .85rem; color: var(--ink-soft); }
.tag-basic { font-family: var(--body); font-size: .7rem; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 4px; padding: 0 .3rem; margin-left: .3rem; vertical-align: middle; }

/* 헤일로 아바타: 노란 링이 호감도만큼 찬다 */
.halo { --size: 44px; --pct: 0; position: relative; width: var(--size); height: var(--size); flex: none; display: inline-block; }
.halo .face { position: absolute; inset: 4px; border-radius: 50%; background: color-mix(in srgb, var(--school, var(--blue)) 78%, #000); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--size) * .42); }
.halo .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--halo) calc(var(--pct) * 1%), var(--halo-track) 0); -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%); mask: radial-gradient(circle, transparent 62%, #000 63%); }
.halo.big { --size: 58px; }
.halo.huge { --size: 96px; }
.halo img.face { width: calc(100% - 8px); height: calc(100% - 8px); object-fit: cover; }
.halo.bump .ring { animation: glow .9s ease-out; }
@keyframes glow { 40% { filter: drop-shadow(0 0 7px var(--halo)); } }

.scenarios { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .8rem; max-width: 760px; }
.scenarios button { width: 100%; text-align: left; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1rem 1.2rem; cursor: pointer; display: grid; gap: .3rem; }
.scenarios button:hover { border-color: var(--blue); }
.scenarios h2 { font-size: 1.35rem; }
.loc { font-size: .88rem; color: var(--blue-deep); }

.world { max-width: 68ch; display: grid; gap: 1.6rem; }
.world h2 { font-size: 1.4rem; margin-bottom: .3rem; }
.world p { margin: 0; }

.view.chat { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: .8rem; padding-block: .8rem; padding-inline: clamp(16px, 3vw, 32px); background: var(--paper); border-bottom: 1px solid var(--line); }
.chat-halos { display: flex; }
.chat-halos .halo + .halo { margin-left: -12px; }
.chat-title { flex: 1; min-width: 0; }
.chat-title h1 { font-size: 1.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-title p { margin: 0; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head select { width: auto; max-width: 150px; font-size: .85rem; }

.messages-wrap { flex: 1; min-height: 0; position: relative; display: flex; }
.jump { position: absolute; right: clamp(16px, 4vw, 48px); bottom: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--blue-deep); border-radius: 999px; padding: .35rem .9rem; font: 500 .85rem var(--body); cursor: pointer; }
.scene-line { font-size: .85rem; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: .4rem; margin-top: .2rem; }
.messages { list-style: none; margin: 0; flex: 1; overflow-y: auto; padding-block: 1.5rem; padding-inline: clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 1.2rem; }
.msg { max-width: 68ch; min-width: 0; word-break: keep-all; } /* 한글이 글자 중간에서 줄바꿈되지 않게 */
.msg.user { align-self: flex-end; background: var(--blue); color: #ffffff; -webkit-text-fill-color: #ffffff; padding: .65rem 1rem; border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg); white-space: pre-wrap; max-width: min(68ch, 85%); overflow-wrap: anywhere; }
.msg.assistant { align-self: flex-start; display: grid; gap: .7rem; width: 100%; }
.narr { color: var(--ink-soft); margin: 0; padding-left: .75rem; border-left: 3px solid var(--line); }
.line { display: grid; grid-template-columns: auto 1fr; gap: .6rem; align-items: start; }
.line .halo { --size: 34px; }
.bubble { background: var(--paper); border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg); padding: .6rem 1rem; border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.bubble b { display: block; font-family: var(--display); font-weight: 400; font-size: 1rem; color: color-mix(in srgb, var(--school, var(--blue-deep)) 55%, var(--ink)); margin-bottom: .1rem; }
.plain { margin: 0; overflow-wrap: anywhere; }
.affection-note { font-size: .85rem; color: var(--gold-text); }
.status-line { color: var(--ink-soft); }
.error-line { color: var(--danger); font-size: .88rem; }
.empty { color: var(--ink-soft); }

.composer { background: var(--paper); border-top: 1px solid var(--line); padding-block: .7rem 1rem; padding-inline: clamp(16px, 3vw, 32px); display: grid; gap: .5rem; }
.composer-tools { display: flex; gap: .4rem; flex-wrap: wrap; }
.composer-tools .btn { font-size: .85rem; padding: .3rem .7rem; }
.format-tools { display: flex; gap: .4rem; margin-left: auto; }
.format-tools .btn { min-width: 2.6rem; font-weight: 700; }
.msg[data-i] { cursor: pointer; }
.msg.selected.user { box-shadow: 0 0 0 2px var(--blue-deep); }
.msg.selected.assistant { box-shadow: -3px 0 0 var(--blue); padding-left: .5rem; }
.msg-bar { display: flex; align-items: center; gap: .4rem; background: var(--bg); border-radius: var(--radius-sm); padding: .35rem .5rem; }
.msg-bar span { flex: 1; min-width: 0; font-size: .85rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-bar .btn { font-size: .85rem; padding: .3rem .8rem; }
.btn.danger { border: 1px solid var(--danger); background: var(--paper); color: var(--danger); }
.composer-row { display: flex; gap: .6rem; align-items: end; }
.composer-row textarea { resize: none; }

.sheet { border: 0; padding: 0; border-radius: var(--radius-lg); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); color: var(--ink); background: var(--paper); }
.sheet::backdrop { background: var(--scrim); }
.sheet-inner { padding: 1.5rem; display: grid; gap: 1rem; }
.sheet-top { display: flex; gap: 1rem; align-items: center; }
.sheet-top h2 { font-size: 1.8rem; word-break: keep-all; }
.sheet-top p { margin: 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin: 0; font-size: .95rem; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; }
.sheet label { display: grid; gap: .35rem; font-size: .95rem; }
.sheet-actions { display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; }
.pick { display: flex; flex-wrap: wrap; gap: .35rem; max-height: 200px; overflow-y: auto; padding: .2rem; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .6rem 1rem; border-radius: var(--radius-sm); font-size: .9rem; max-width: calc(100% - 32px); z-index: 30; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .only-mobile { display: initial; }
  .topbar { display: flex; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 85vw); z-index: 20; transform: translateX(-100%); transition: transform .2s;
    padding-top: calc(1rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); padding-left: calc(1rem + env(safe-area-inset-left, 0px)); }
  .sidebar.open { transform: none; box-shadow: 0 0 0 100vmax var(--scrim); }
  .view { padding-block: 1.2rem; }
  h1 { font-size: 1.6rem; }
  .chat-head { gap: .5rem; }
  .chat-head .halo.big { --size: 40px; }
  .chat-halos .halo:nth-child(n+3) { display: none; }
  .chat-title h1 { display: none; }
  .chat-head select { max-width: 92px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <span class="brand small">키보토스 채팅</span>
      <button class="icon-btn only-mobile" id="close-sidebar" aria-label="메뉴 닫기">✕</button>
    </div>
    <nav class="tabs" aria-label="메뉴">
      <button data-view="free" class="tab">자유 모드</button>
      <button data-view="roster" class="tab active">학생 명부</button>
      <button data-view="stories" class="tab">스토리</button>
      <button data-view="world" class="tab">세계관</button>
    </nav>
    <h2 class="side-title">내 대화</h2>
    <ul id="room-list" class="room-list"><li class="empty">대화 목록을 불러오는 중…</li></ul>
    <div class="sidebar-foot">
      <div class="row"><span id="me-name" class="muted">선생님</span><button class="btn link" id="open-settings">이름 바꾸기</button></div>
      <div class="row web-only" hidden><span id="ai-status" class="muted">AI 미설정</span><button class="btn link" id="open-ai">AI 설정</button></div>
      <span id="save-note" class="save-note"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="open-sidebar" aria-label="메뉴 열기">☰</button>
      <span class="brand small" id="topbar-title">키보토스 채팅</span>
    </header>

    <section id="view-roster" class="view">
      <div class="view-head">
        <h1>학생 명부</h1>
        <input id="search" type="search" placeholder="이름, 학교, 동아리로 찾기" aria-label="학생 검색">
      </div>
      <div id="school-filter" class="chips" role="group" aria-label="학교 필터"></div>
      <ul id="roster" class="roster"></ul>
    </section>

    <section id="view-free" class="view" hidden>
      <div class="view-head"><h1>자유 모드</h1></div>
      <p class="muted">키보토스를 돌아다니며 그곳에 있는 학생들을 만납니다. 만난 학생은 누구든 호감도가 쌓입니다. 시작할 곳을 고르세요.</p>
      <ul id="place-list" class="scenarios"></ul>
    </section>

    <section id="view-stories" class="view" hidden>
      <div class="view-head"><h1>스토리</h1></div>
      <p class="muted">여러 학생이 함께 등장하는 이야기입니다. 시나리오를 고르고 함께할 학생을 정하세요.</p>
      <ul id="scenario-list" class="scenarios"></ul>
    </section>

    <section id="view-world" class="view" hidden>
      <div class="view-head"><h1>세계관</h1></div>
      <div id="world" class="world"></div>
    </section>

    <section id="view-chat" class="view chat" hidden>
      <header class="chat-head">
        <div id="chat-halos" class="chat-halos"></div>
        <div class="chat-title"><h1 id="chat-title"></h1><p id="chat-sub" class="muted"></p></div>
        <select id="tier" aria-label="응답 방식">
          <option value="default">기본</option>
          <option value="quick">빠르게</option>
          <option value="complex">깊이 있게</option>
        </select>
        <button class="icon-btn" id="delete-room" aria-label="대화 삭제" title="대화 삭제">🗑</button>
      </header>
      <div class="messages-wrap">
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <button type="button" class="jump" id="jump" hidden>↓ 아래로</button>
      </div>
      <form id="composer" class="composer">
        <div id="msg-bar" class="msg-bar" hidden>
          <span id="msg-bar-label">메시지를 선택했습니다</span>
          <button type="button" class="btn ghost" id="msg-cancel">취소</button>
          <button type="button" class="btn danger" id="msg-del">삭제</button>
        </div>
        <div class="composer-tools">
          <button type="button" class="btn ghost" id="btn-continue">이어서</button>
          <button type="button" class="btn ghost" id="btn-regen">다시 생성</button>
          <button type="button" class="btn ghost" id="btn-undo">되돌리기</button>
          <div class="format-tools" role="group" aria-label="입력 도우미">
            <button type="button" class="btn ghost" data-wrap='"' aria-label="대사 따옴표 넣기" title="대사: 따옴표로 감싸기">" "</button>
            <button type="button" class="btn ghost" data-wrap="*" aria-label="행동 별표 넣기" title="행동: 별표로 감싸기">* *</button>
          </div>
        </div>
        <div class="composer-row">
          <textarea id="input" rows="2" maxlength="2000" placeholder="대사를 쓰거나 *행동*을 별표로 감싸 쓰세요"></textarea>
          <button class="btn primary" type="submit" id="send">보내기</button>
        </div>
      </form>
    </section>
  </main>
</div>

<dialog id="sheet" class="sheet"><form method="dialog" class="sheet-inner" id="sheet-body"></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
// 세계관·학교·학생·시나리오 데이터. tools/build_artifact.py 가 data/*.json 을 이 자리에 넣는다.
